[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-paper-trl"
version = "0.4.2"
description = "Evidence-led single-paper TRL estimation from title and abstract"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "energy-paper-trl contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
# scikit-learn is required to load/joblib the SVM pipeline and to run explain_linear.
models = [
  "joblib>=1.3",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "transformers>=4.40",
]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
energy-paper-trl = "energy_paper_trl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
